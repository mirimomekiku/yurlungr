[package]
name = "yurlungr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["serde"] }
git2 = { version = "0.21.0", default-features = false }
ignore = "0.4.34"
portable-pty = "0.9"
ratatui = { version = "0.30", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-term = "0.3.4"
unicode-width = "0.2.3"
vt100 = "0.16"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tempfile = "3"
